<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { padding: 18px; color: #e4e5e8; background: #27292d; font-family: sans-serif; font-size: 12px; }
    h1 { font-size: 18px; margin-bottom: 8px; }
    p { margin-bottom: 14px; line-height: 1.5; }
    button { padding: 9px 12px; margin: 4px 0; width: 100%; }
    #status { padding: 10px; background: #1c1e22; border-radius: 6px; margin-top: 14px; }
    #log { white-space: pre-wrap; font-size: 11px; max-height: 180px; overflow: auto; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Design Agent Studio</h1>
  <p>连接本机服务后，执行已校验的 Photoshop 操作。请先启动项目服务，再选择项目中的 .studio/connection.json。</p>
  <button id="connect">选择连接文件并连接</button>
  <button id="disconnect" disabled>停止接收任务</button>
  <div id="status">尚未连接</div>
  <div id="log"></div>
  <script src="main.js"></script>
</body>
</html>
